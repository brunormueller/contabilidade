<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Notas e Financeiro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
    <style>
      :root {
        --bg: #f3f4f6;
        --surface: #ffffff;
        --surface-2: #f0f2f5;
        --ink: #101828;
        --ink-2: #475467;
        --ink-3: #7a8599;
        --line: #e3e6eb;
        --line-2: #d3d8e0;
        --navy: #0e1a2c;
        --navy-2: #18263c;
        --on-navy: #edf1f7;
        --on-navy-2: #93a0b6;
        --brass: #c2a15e;
        --brass-ink: #1e1709;
        --brand: #14233b;
        --brand-ink: #ffffff;
        --brand-soft: #e9edf4;
        --ok: #17744a;
        --ok-soft: #e3f3ea;
        --warn: #8f5e0c;
        --warn-soft: #fbf0da;
        --bad: #b42318;
        --bad-soft: #fbe6e3;
        --shadow:
          0 1px 2px rgba(16, 24, 40, 0.05),
          0 6px 24px -8px rgba(16, 24, 40, 0.08);
        --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b111a;
          --surface: #121a26;
          --surface-2: #19222f;
          --ink: #e9edf3;
          --ink-2: #b1bbca;
          --ink-3: #8692a5;
          --line: #232d3b;
          --line-2: #2e3a4b;
          --navy: #080d15;
          --navy-2: #121b28;
          --on-navy: #e9edf3;
          --on-navy-2: #8692a5;
          --brass: #d4b676;
          --brass-ink: #1e1709;
          --brand: #d4b676;
          --brand-ink: #1e1709;
          --brand-soft: #2a2618;
          --ok: #6fcb98;
          --ok-soft: #14301f;
          --warn: #e6b66a;
          --warn-soft: #352812;
          --bad: #f2877d;
          --bad-soft: #3a1a17;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -10px rgba(0, 0, 0, 0.5);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b111a;
        --surface: #121a26;
        --surface-2: #19222f;
        --ink: #e9edf3;
        --ink-2: #b1bbca;
        --ink-3: #8692a5;
        --line: #232d3b;
        --line-2: #2e3a4b;
        --navy: #080d15;
        --navy-2: #121b28;
        --on-navy: #e9edf3;
        --on-navy-2: #8692a5;
        --brass: #d4b676;
        --brass-ink: #1e1709;
        --brand: #d4b676;
        --brand-ink: #1e1709;
        --brand-soft: #2a2618;
        --ok: #6fcb98;
        --ok-soft: #14301f;
        --warn: #e6b66a;
        --warn-soft: #352812;
        --bad: #f2877d;
        --bad-soft: #3a1a17;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -10px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        background: var(--bg);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Instrument Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }
      img {
        max-width: 100%;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      svg.i {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      /* login */
      .login {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      }
      .login-art {
        background: var(--navy);
        color: var(--on-navy);
        padding: 48px clamp(32px, 5vw, 72px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .login-art::after {
        content: "";
        position: absolute;
        right: -120px;
        bottom: -120px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        border: 1px solid rgba(194, 161, 94, 0.25);
        box-shadow:
          0 0 0 60px rgba(194, 161, 94, 0.05),
          0 0 0 120px rgba(194, 161, 94, 0.03);
      }
      .login-art h2 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(36px, 4vw, 54px);
        line-height: 1.05;
        margin: 0 0 18px;
        max-width: 14ch;
        letter-spacing: -0.01em;
      }
      .login-art p {
        color: var(--on-navy-2);
        max-width: 40ch;
        margin: 0;
      }
      .login-art .foot {
        font-size: 13px;
        color: var(--on-navy-2);
        position: relative;
        z-index: 1;
      }
      .login-form {
        display: grid;
        place-items: center;
        padding: 40px 20px;
        background: var(--bg);
      }
      .login-card {
        width: 100%;
        max-width: 380px;
      }
      .login-card h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 38px;
        margin: 0 0 6px;
      }
      .login-card .field {
        margin-bottom: 14px;
      }
      .login-card .btn.primary {
        width: 100%;
        justify-content: center;
        padding: 12px;
        font-size: 15px;
      }
      .loginerr {
        color: var(--bad);
        font-size: 14px;
        min-height: 21px;
        margin: 0 0 8px;
      }
      .demo {
        margin-top: 28px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        font-size: 13.5px;
        color: var(--ink-2);
      }
      .demo p {
        margin: 0 0 10px;
      }
      .demo .row {
        gap: 8px;
      }

      /* shell */
      .app {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
        min-height: 100vh;
        min-height: 100dvh;
      }
      .side {
        background: var(--navy);
        color: var(--on-navy);
        padding: 24px 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        height: 100vh;
        height: 100dvh;
        overflow: auto;
        align-self: start;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 8px;
        min-width: 0;
      }
      .brand > div {
        min-width: 0;
      }
      .mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--brass);
        color: var(--brass-ink);
        display: grid;
        place-items: center;
        font-family: var(--serif);
        font-size: 20px;
        flex: none;
      }
      .brand b {
        display: block;
        font-size: 14px;
        line-height: 1.25;
        font-weight: 600;
      }
      .brand small {
        color: var(--on-navy-2);
        font-size: 12.5px;
      }
      .env {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--brass);
        border: 1px solid rgba(194, 161, 94, 0.35);
        padding: 3px 10px;
        border-radius: 999px;
        width: max-content;
        margin-left: 8px;
      }
      .env::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 11px;
        background: none;
        border: 0;
        text-align: left;
        padding: 9px 12px;
        border-radius: 9px;
        cursor: pointer;
        color: var(--on-navy-2);
        font-weight: 500;
        position: relative;
      }
      .nav button:hover {
        background: var(--navy-2);
        color: var(--on-navy);
      }
      .nav button[aria-current="page"] {
        background: var(--navy-2);
        color: var(--on-navy);
      }
      .nav button[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--brass);
      }
      .nav button[aria-current="page"] svg {
        color: var(--brass);
      }
      .me {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 8px 0;
        border-top: 1px solid var(--navy-2);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--navy-2);
        color: var(--on-navy);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        flex: none;
        border: 1px solid rgba(194, 161, 94, 0.4);
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      button.avatar {
        padding: 0;
        cursor: pointer;
        width: 36px;
        height: 36px;
      }
      .avatar.sm {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
      .avatar.lg {
        width: 76px;
        height: 76px;
        font-size: 26px;
        border-width: 2px;
      }
      .me .who {
        display: flex;
        align-items: center;
        gap: 11px;
        flex: 1;
        min-width: 0;
        background: none;
        border: 0;
        margin: -6px 0 -6px -6px;
        padding: 6px;
        border-radius: 10px;
        text-align: left;
        color: inherit;
        cursor: pointer;
      }
      .me .who:hover {
        background: var(--navy-2);
      }
      .me .who-txt {
        display: block;
        min-width: 0;
        flex: 1;
      }
      .me small {
        display: block;
      }
      .perfil {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .perfil > div {
        min-width: 0;
      }
      .perfil b {
        display: block;
        font-size: 16px;
      }
      .withav {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mobileacts {
        display: none;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .me b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .me small {
        color: var(--on-navy-2);
        font-size: 12px;
      }
      .me button {
        background: none;
        border: 0;
        color: var(--on-navy-2);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        display: grid;
      }
      .me button:hover {
        color: var(--on-navy);
        background: var(--navy-2);
      }

      main {
        padding: 40px clamp(18px, 4vw, 56px) 72px;
        max-width: 1160px;
        width: 100%;
        container-type: inline-size;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 40px;
        line-height: 1.05;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      .lead {
        color: var(--ink-2);
        margin: 0 0 28px;
        max-width: 64ch;
      }
      .muted {
        color: var(--ink-3);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .spread {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line-2);
        background: var(--surface);
        padding: 9px 15px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        white-space: nowrap;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .btn:hover {
        border-color: var(--ink-3);
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--brand-ink);
        font-weight: 600;
      }
      .btn.primary:hover {
        filter: brightness(1.15);
      }
      .btn.small {
        padding: 5px 11px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13.5px;
      }
      .link:hover {
        text-decoration-color: currentColor;
      }
      .link.bad {
        color: var(--bad);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px 24px;
        box-shadow: var(--shadow);
      }
      .stack {
        display: grid;
        gap: 20px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
        gap: 20px;
      }

      /* o gap de 1px sobre o fundo --line desenha os divisores em qualquer quebra */
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--line);
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
      }
      .summary div {
        padding: 20px 22px;
        background: var(--surface);
        min-width: 0;
      }
      .summary span {
        display: block;
        font-size: 13px;
        color: var(--ink-3);
        font-weight: 500;
      }
      .summary strong {
        display: block;
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(22px, 4cqi - 6px, 32px);
        line-height: 1.1;
        margin-top: 6px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .summary em {
        font-style: normal;
        font-size: 12.5px;
        color: var(--bad);
        font-weight: 500;
      }

      .alert {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 20px;
        background: var(--warn-soft);
        color: var(--warn);
        font-size: 14.5px;
      }
      .alert.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .alert b {
        font-weight: 600;
      }

      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th {
        text-align: left;
        font-weight: 500;
        color: var(--ink-3);
        font-size: 12.5px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        background: var(--surface-2);
      }
      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      tbody tr:hover td {
        background: color-mix(in srgb, var(--surface-2) 55%, transparent);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.num,
      th.num {
        text-align: right;
        white-space: nowrap;
      }
      td .sub {
        display: block;
        color: var(--ink-3);
        font-size: 12.5px;
      }
      tfoot td {
        font-weight: 600;
        background: var(--surface-2);
        border-top: 1px solid var(--line);
      }
      .actions {
        display: flex;
        gap: 14px;
        justify-content: flex-end;
        white-space: nowrap;
      }
      .errlist {
        margin: 4px 0 0;
        padding-left: 16px;
        color: var(--bad);
        font-size: 12.5px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .chip.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .chip.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .chip.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .chip.neutral {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .chip.brand {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .chip.pulse::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        animation: p 1s ease-in-out infinite;
      }
      @keyframes p {
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .chip.pulse::before {
          animation: none;
        }
        * {
          transition: none !important;
        }
      }

      .drop {
        display: block;
        border: 1.5px dashed var(--line-2);
        border-radius: 16px;
        padding: 44px 20px;
        text-align: center;
        cursor: pointer;
        background: var(--surface);
        transition:
          background 0.15s,
          border-color 0.15s;
        position: relative;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--brass);
        background: color-mix(in srgb, var(--brass) 7%, var(--surface));
      }
      .drop svg {
        width: 28px;
        height: 28px;
        color: var(--brass);
        margin-bottom: 10px;
      }
      .drop strong {
        display: block;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 26px;
        margin-bottom: 4px;
      }
      .drop input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      details {
        margin-top: 20px;
        color: var(--ink-2);
        font-size: 14px;
      }
      details summary {
        cursor: pointer;
        font-weight: 500;
        color: var(--ink);
      }
      details code {
        background: var(--surface-2);
        padding: 1px 6px;
        border-radius: 5px;
        font-size: 13px;
      }

      .progress {
        height: 6px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
        margin: 14px 0 22px;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--brass);
        width: 0;
        transition: width 0.3s;
      }
      .banner {
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 20px;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .banner b {
        display: block;
        font-size: 16px;
      }
      .banner.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
        gap: 14px 16px;
        align-items: end;
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field label {
        font-size: 13px;
        color: var(--ink-2);
        font-weight: 500;
      }
      .field input,
      .field select {
        border: 1px solid var(--line-2);
        background: var(--surface);
        border-radius: 10px;
        padding: 9px 12px;
        min-width: 0;
        width: 100%;
        transition:
          border-color 0.15s,

    <script>
      /* ---------- utilitários ---------- */
      const brlF = new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL",
      });
      const brl = (v) => brlF.format(v || 0);
      const pad = (n, l = 2) => String(n).padStart(l, "0");
      function toISO(d) {
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }
      const todayISO = () => toISO(new Date());
      function addDays(iso, n) {
        const [y, m, d] = iso.split("-").map(Number);
        return toISO(new Date(y, m - 1, d + n));
      }
      function addMonths(iso, n) {
        const [y, m, d] = iso.split("-").map(Number);
        const dt = new Date(y, m - 1 + n, 1);
        const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
        dt.setDate(Math.min(d, last));
        return toISO(dt);
      }
      const fmtDate = (iso) =>
        iso ? iso.slice(0, 10).split("-").reverse().join("/") : "—";
      const fmtDateTime = (iso) => {
        const d = new Date(iso);
        return (
          d.toLocaleDateString("pt-BR") +
          " " +
          d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        );
      };
      const monthLabel = (ym) => {
        const [y, m] = ym.split("-").map(Number);
        const s = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", {
          month: "long",
          year: "numeric",
        });
        return s.charAt(0).toUpperCase() + s.slice(1);
      };
      const uid = () =>
        Math.random().toString(36).slice(2, 10) +
        Date.now().toString(36).slice(-4);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const digits = (s) => String(s ?? "").replace(/\D/g, "");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      function cnpjDV(b) {
        const calc = (s, n) => {
          let t = 0,
            p = n - 7;
          for (let i = 0; i < n; i++) {
            t += +s[i] * p--;
            if (p < 2) p = 9;
          }
          const r = t % 11;
          return r < 2 ? 0 : 11 - r;
        };
        const d1 = calc(b, 12);
        const d2 = calc(b + d1, 13);
        return b + d1 + d2;
      }
      function cpfDV(b) {
        const calc = (s, n) => {
          let t = 0;
          for (let i = 0; i < n; i++) t += +s[i] * (n + 1 - i);
          let r = (t * 10) % 11;
          return r === 10 ? 0 : r;
        };
        const d1 = calc(b, 9);
        return b + d1 + calc(b + d1, 10);
      }
      function validCNPJ(c) {
        c = digits(c);
        if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
        return cnpjDV(c.slice(0, 12)) === c;
      }
      function validCPF(c) {
        c = digits(c);
        if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
        return cpfDV(c.slice(0, 9)) === c;
      }
      function fmtDoc(d) {
        d = digits(d);
        if (d.length === 14)
          return d.replace(
            /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
            "$1.$2.$3/$4-$5",
          );
        if (d.length === 11)
          return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
        return d;
      }
      const fmtServ = (c) =>
        c && c.length === 6
          ? `${c.slice(0, 2)}.${c.slice(2, 4)}.${c.slice(4)}`
          : c || "—";

      /* ---------- estado ---------- */
      const KEY = "nfse-jgs-v1",
        SKEY = "nfse-jgs-sessao";
      function defaultState() {
        return {
          empresa: {
            razao: "",
            cnpj: cnpjDV("112223330001"),
            im: "",
            ibge: "4208906",
            serie: "900",
            proxDPS: 1,
            proxNFSe: 1,
            vencDias: 10,
            cServPadrao: "",
            cert: null,
          },
          users: [],
          notas: [],
          receber: [],
          pagar: [],
          lotes: [],
        };
      }
      let S;
      try {
        const raw = localStorage.getItem(KEY);
        S = raw ? JSON.parse(raw) : null;
      } catch (e) {
        S = null;
      }
      S = Object.assign(defaultState(), S || {});
      S.empresa = Object.assign(defaultState().empresa, S.empresa || {});
      delete S.role;
      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
          return true;
        } catch (e) {
          return false;
        }
      }

      let view = "painel";
      let batch = null;
      let me = null;
      const F = {
        notasMes: todayISO().slice(0, 7),
        notasStatus: "todas",
        receber: "abertos",
        pagar: "abertos",
        expMes: todayISO().slice(0, 7),
      };

      /* ---------- login ---------- */
      async function hashPw(pw, salt) {
        const d = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(salt + ":" + pw),
        );
        return [...new Uint8Array(d)]
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }
      async function novoUsuario(nome, email, perfil, senha) {
        const salt = uid() + uid();
        return {
          id: uid(),
          nome,
          email: email.toLowerCase(),
          perfil,
          salt,
          hash: await hashPw(senha, salt),
          criadoEm: new Date().toISOString(),
        };
      }
      async function seedUsers() {
        if (S.users.length) return;
        S.users = [
          await novoUsuario(
            "Gustavo",
            "gustavo@empresa.com.br",
            "empresa",
            "demo1234",
          ),
          await novoUsuario(
            "Contador",
            "contador@escritorio.com.br",
            "contador",
            "demo1234",
          ),
        ];
        save();
      }
      function loadSession() {
        try {
          const id = localStorage.getItem(SKEY);
          me = S.users.find((u) => u.id === id) || null;
        } catch (e) {
          me = null;
        }
      }
      async function entrar(email, senha) {
        const u = S.users.find((x) => x.email === email.trim().toLowerCase());
        if (!u || (await hashPw(senha, u.salt)) !== u.hash) return false;
        me = u;
        try {
          localStorage.setItem(SKEY, u.id);
        } catch (e) {}
        view = "painel";

      function binStr(buf) {
        const u = new Uint8Array(buf);
        let s = "";
        for (let i = 0; i < u.length; i += 8192)
          s += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
        return s;
      }
      async function verificarCert() {
        const fi = document.getElementById("certFile"),
          pw = document.getElementById("certSenha"),
          out = document.getElementById("certErr");
        out.textContent = "";
        const file = fi.files[0];
        if (!file) {
          out.textContent = "Escolha o arquivo .pfx ou .p12 do certificado.";
          return;
        }
        if (!pw.value) {
          out.textContent = "Informe a senha do certificado.";
          pw.focus();
          return;
        }
        if (typeof forge === "undefined") {
          out.textContent =
            "O leitor de certificados não carregou. Recarregue a página.";
          return;
        }
        try {
          const p12 = forge.pkcs12.pkcs12FromAsn1(
            forge.asn1.fromDer(binStr(await file.arrayBuffer())),
            false,
            pw.value,
          );
          const bags = (
            p12.getBags({ bagType: forge.pki.oids.certBag })[
              forge.pki.oids.certBag
            ] || []
          )
            .map((b) => b.cert)
            .filter(Boolean);
          const cn = (c) => {
            const a = c.subject.getField("CN");
            return a ? a.value : "";
          };
          const cert =
            bags.find((c) => /:\d{14}$/.test(cn(c))) ||
            bags.find((c) => {
              const bc = c.getExtension("basicConstraints");
              return !bc || !bc.cA;
            }) ||
            bags[0];
          if (!cert) throw new Error("sem certificado");
          const nome = cn(cert);
          const m = nome.match(/^(.*):(\d{14})$/);
          const cnpj = m ? m[2] : "";
          if (cnpj && cnpj !== digits(S.empresa.cnpj)) {
            out.textContent = `Este certificado é do CNPJ ${fmtDoc(cnpj)}, diferente do cadastrado (${fmtDoc(S.empresa.cnpj)}).`;
            return;
          }
          const iss = cert.issuer.getField("CN");
          S.empresa.cert = {
            titular: m ? m[1] : nome,
            cnpj: cnpj || digits(S.empresa.cnpj),
            emissor: iss ? iss.value : "",
            validoDe: toISO(cert.validity.notBefore),
            validoAte: toISO(cert.validity.notAfter),
            verificadoEm: new Date().toISOString(),
            arquivo: file.name,
          };
          save();
          render();
          toast("Certificado verificado");
        } catch (e) {
          const msg = String((e && e.message) || "");
          out.textContent = /password|MAC/i.test(msg)
            ? "Senha incorreta para este certificado."
            : "Não consegui ler este arquivo. Confira se é o .pfx ou .p12 do e-CNPJ A1.";
        } finally {
          pw.value = "";
        }
      }

      /* --- lote --- */
      const HEAD = [

      const COLS = {

        ],
        email: ["tomador_email", "email", "e-mail", "email do cliente"],
        descricao: [

        ],

      };
      const norm = (s) =>
        String(s)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/_/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      function mapHeaders(headers) {
        const map = {};
        headers.forEach((h) => {
          const nh = norm(h);
          for (const k in COLS) {
            if (!map[k] && COLS[k].some((a) => norm(a) === nh)) {
              map[k] = h;
              break;
            }
          }
        });
        return map;
      }
      function parseValor(v) {
        if (typeof v === "number") return v;
        let s = String(v ?? "").replace(/[R$\s]/g, "");
        if (!s) return NaN;
        if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
        return parseFloat(s);
      }
      function parseData(v) {
        if (v === "" || v == null) return "";
        if (v instanceof Date && !isNaN(v))
          return toISO(new Date(v.getTime() + 12 * 3600e3));
        if (typeof v === "number") {
          const d = new Date(Math.round((v - 25569) * 864e5));
          return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
        }
        const s = String(v).trim();
        let m;
        if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) {
          const y = m[3].length === 2 ? "20" + m[3] : m[3];
          return `${y}-${pad(m[2])}-${pad(m[1])}`;
        }
        if ((m = s.match(/^(\d{1,2})\/(\d{4})$/)))
          return `${m[2]}-${pad(m[1])}-01`;
        if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/)))
          return `${m[1]}-${m[2]}-${m[3]}`;
        if ((m = s.match(/^(\d{4})-(\d{2})$/))) return `${m[1]}-${m[2]}-01`;
        return "invalida";
      }
      function validarLinhas(objs) {
        const headers = objs.length ? Object.keys(objs[0]) : [];
        const map = mapHeaders(headers);
        const faltando = ["doc", "nome", "descricao", "valor"].filter(
          (k) => !map[k],
        );
        const rows = [];
        objs.forEach((o, idx) => {
          const g = (k) => (map[k] ? o[map[k]] : "");
          if (Object.values(o).every((v) => String(v).trim() === "")) return;
          const r = {
            i: idx + 2,
            doc: digits(g("doc")),
            nome: String(g("nome")).trim(),
            email: String(g("email")).trim(),
            descricao: String(g("descricao")).trim(),
            valor: parseValor(g("valor")),
            cServ: digits(g("cServ")) || digits(S.empresa.cServPadrao),
            competencia: parseData(g("competencia")),
            vencimento: parseData(g("vencimento")),
            errors: [],
            status: "fila",
          };
          if (
            r.doc.length === 14
              ? !validCNPJ(r.doc)
              : r.doc.length === 11
                ? !validCPF(r.doc)
                : true
          )
            r.errors.push("CPF ou CNPJ do tomador inválido");
          if (!r.nome) r.errors.push("Nome do tomador vazio");
          if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email))
            r.errors.push("E-mail inválido");
          if (!r.descricao) r.errors.push("Descrição do serviço vazia");
          if (!(r.valor > 0)) r.errors.push("Valor deve ser maior que zero");
          else r.valor = Math.round(r.valor * 100) / 100;
          if (r.cServ.length !== 6)
            r.errors.push(
              "Código de serviço precisa ter 6 dígitos (ex.: 01.07.01)",
            );
          if (r.competencia === "invalida")
            r.errors.push("Competência em formato desconhecido");
          if (r.vencimento === "invalida")
            r.errors.push("Vencimento em formato desconhecido");
          if (!r.competencia) r.competencia = todayISO();
          if (!r.vencimento)
            r.vencimento = addDays(todayISO(), +S.empresa.vencDias || 10);
          rows.push(r);
        });
        return { rows, faltando };
      }
      async function lerArquivo(file) {

          const wb = XLSX.read(buf, { type: "array", cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const objs = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
          const { rows, faltando } = validarLinhas(objs);
          if (faltando.length) {
            const nomes = {
              doc: "CPF/CNPJ do tomador",
              nome: "nome do tomador",
              descricao: "descrição",
              valor: "valor",

              msg: `Não encontrei as colunas: ${faltando.map((k) => nomes[k]).join(", ")}. Confira o cabeçalho ou use a planilha modelo.`,
            };
          } else if (!rows.length) {
            batch = {
              phase: "erro",
              fileName: file.name,
              msg: "A planilha não tem linhas preenchidas.",
            };
          } else batch = { phase: "preview", fileName: file.name, rows };
          render();
        } catch (e) {
          batch = {
            phase: "erro",
            fileName: file.name,
            msg: "Não consegui ler esse arquivo. Envie um .xlsx ou .csv.",
          };
          render();
        }
      }
      function exemplo() {

      function gerarChave(numero) {
        const e = S.empresa;
        const now = new Date();
        const base =
          e.ibge +
          "2" +
          "2" +
          digits(e.cnpj).padStart(14, "0") +
          String(numero).padStart(13, "0") +
          String(now.getFullYear()).slice(2) +
          pad(now.getMonth() + 1) +
          String(Math.floor(Math.random() * 1e9)).padStart(9, "0");
        let t = 0,
          p = 2;
        for (let i = base.length - 1; i >= 0; i--) {
          t += +base[i] * p;
          p = p === 9 ? 2 : p + 1;
        }
        const r = t % 11;
        return base + (r < 2 ? 0 : 11 - r);
      }

                .join(";"),

      // corta no centro e reduz para 192px, para caber folgado no localStorage
      async function salvarFoto(file) {
        if (!/^image\//.test(file.type)) {
          toast("Escolha um arquivo de imagem.");
          return;
        }
        let foto;
        try {
          const url = URL.createObjectURL(file);
          const img = new Image();
          await new Promise((ok, err) => {
            img.onload = ok;
            img.onerror = err;
            img.src = url;
          });
          URL.revokeObjectURL(url);
          const L = 192,
            s = Math.min(img.naturalWidth, img.naturalHeight);
          const c = document.createElement("canvas");
          c.width = c.height = L;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, L, L);
          ctx.drawImage(
            img,
            (img.naturalWidth - s) / 2,
            (img.naturalHeight - s) / 2,
            s,
            s,
            0,
            0,
            L,
            L,
          );
          foto = c.toDataURL("image/jpeg", 0.85);
        } catch (e) {
          toast("Não consegui ler essa imagem.");
          return;
        }
        const antes = me.foto;
        me.foto = foto;
        if (!save()) {
          me.foto = antes;
          toast("Sem espaço no navegador para salvar a foto.");
          return;
        }
        render();
        abrirPerfil();
        toast("Foto atualizada");
      }

          case "modelo":
            baixarModelo();
            break;
          case "exemplo":
            exemplo();
            break;
          case "trocar":
            batch = null;
            render();
            break;
          case "emitir":
            emitirLote();
            break;
          case "ver":
            verNota(id);
            break;
          case "xml": {
            const n = S.notas.find((x) => x.id === id);
            if (n) zipNotas([n], `NFSe-${n.numero}.zip`);
            break;
          }
          case "cancelar":
            pedirCancelamento(id);
            break;
          case "confirmaCancel":
            confirmaCancel(id);
            break;
          case "fechar":
            closeModal();
            break;
          case "zipMes":
            zipNotas(
              notasFiltradas(F.notasMes, F.notasStatus),
              `NFSe-xml-${F.notasMes}.zip`,
            );
            break;
          case "zipExp":
            zipNotas(
              S.notas.filter((n) => n.competencia.slice(0, 7) === F.expMes),
              `NFSe-xml-${F.expMes}.zip`,
            );
            break;
          case "csvNotas":
            csvNotas();
            break;
          case "csvFin":
            csvFin();
            break;
          case "receber": {
            const t = S.receber.find((x) => x.id === id);
            t.recebidoEm = todayISO();
            save();
            render();
            toast("Recebimento registrado");
            break;
          }
          case "desfazRec": {
            const t = S.receber.find((x) => x.id === id);
            t.recebidoEm = null;
            save();
            render();
            break;
          }
          case "addPagar":
            addPagar();
            break;
          case "pagar":
            marcarPaga(id);
            break;
          case "desfazPag": {
            const t = S.pagar.find((x) => x.id === id);
            t.pagoEm = null;
            save();
            render();
            break;
          }
          case "delPagar":
            S.pagar = S.pagar.filter((x) => x.id !== id);
            save();
            render();
            toast("Conta excluída");
            break;
          case "salvarCfg":
            salvarCfg();
            break;
          case "verCert":
            verificarCert();
            break;
          case "addUser":
            addUser();
            break;
          case "delUser": {
            const u = S.users.find((x) => x.id === id);
            if (!u || u.id === me.id) break;
            openModal(
              `<h2>Remover acesso de ${esc(u.nome)}?</h2><p class="muted">${esc(u.email)} não vai mais conseguir entrar no sistema.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-action="fechar">Voltar</button><button class="btn primary" data-action="confirmaDelUser" data-id="${u.id}">Remover acesso</button></div>`,
            );
            break;
          }
          case "confirmaDelUser":
            if (!isEmp()) break;
            S.users = S.users.filter((x) => x.id !== id || x.id === me.id);
            save();
            closeModal();
            render();
            toast("Acesso removido");
            break;
          case "resetAsk":
            openModal(
              `<h2>Apagar movimentações?</h2><p class="muted">Notas, contas a receber, contas a pagar e lotes deste navegador serão apagados. Não dá para desfazer.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-action="fechar">Voltar</button><button class="btn primary" data-action="reset">Apagar movimentações</button></div>`,
            );
            break;
          case "reset":
            Object.assign(S, { notas: [], receber: [], pagar: [], lotes: [] });
            S.empresa.proxDPS = 1;
            S.empresa.proxNFSe = 1;
            batch = null;
            save();
            closeModal();
            go("painel");
            toast("Movimentações apagadas");
            break;
        }
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "file" && t.files[0]) {
          if (isEmp()) lerArquivo(t.files[0]);
          return;
        }
        if (t.id === "fotoFile" && t.files[0]) {
          salvarFoto(t.files[0]);
          return;
        }
        if (t.dataset.filter) {
          if (t.value || t.type !== "month") {
            F[t.dataset.filter] = t.value;
            render();
          }
        }
      });

      (async () => {
        try {
          await seedUsers();
        } catch (e) {}
        loadSession();
        render();
      })();
    </script>
  </body>
</html>
