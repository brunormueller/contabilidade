<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Notas e Financeiro</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <!-- servidos pelo próprio site (public/vendor): SheetJS 0.20.3 de cdn.sheetjs.com, JSZip 3.10.1 do npm -->
    <script src="/vendor/xlsx-0.20.3.full.min.js"></script>
    <script src="/vendor/jszip-3.10.1.min.js"></script>
    <style>
      :root {
        --bg: #f3f4f6;
        --surface: #ffffff;
        --surface-2: #f0f2f5;
        --ink: #101828;
        --ink-2: #475467;
        --ink-3: #7a8599;
        --line: #e3e6eb;
        --line-2: #d3d8e0;
        --navy: #0e1a2c;
        --navy-2: #18263c;
        --on-navy: #edf1f7;
        --on-navy-2: #93a0b6;
        --brass: #c2a15e;
        --brass-ink: #1e1709;
        --brand: #14233b;
        --brand-ink: #ffffff;
        --brand-soft: #e9edf4;
        --ok: #17744a;
        --ok-soft: #e3f3ea;
        --warn: #8f5e0c;
        --warn-soft: #fbf0da;
        --bad: #b42318;
        --bad-soft: #fbe6e3;
        --shadow:
          0 1px 2px rgba(16, 24, 40, 0.05),
          0 6px 24px -8px rgba(16, 24, 40, 0.08);
        --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b111a;
          --surface: #121a26;
          --surface-2: #19222f;
          --ink: #e9edf3;
          --ink-2: #b1bbca;
          --ink-3: #8692a5;
          --line: #232d3b;
          --line-2: #2e3a4b;
          --navy: #080d15;
          --navy-2: #121b28;
          --on-navy: #e9edf3;
          --on-navy-2: #8692a5;
          --brass: #d4b676;
          --brass-ink: #1e1709;
          --brand: #d4b676;
          --brand-ink: #1e1709;
          --brand-soft: #2a2618;
          --ok: #6fcb98;
          --ok-soft: #14301f;
          --warn: #e6b66a;
          --warn-soft: #352812;
          --bad: #f2877d;
          --bad-soft: #3a1a17;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -10px rgba(0, 0, 0, 0.5);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b111a;
        --surface: #121a26;
        --surface-2: #19222f;
        --ink: #e9edf3;
        --ink-2: #b1bbca;
        --ink-3: #8692a5;
        --line: #232d3b;
        --line-2: #2e3a4b;
        --navy: #080d15;
        --navy-2: #121b28;
        --on-navy: #e9edf3;
        --on-navy-2: #8692a5;
        --brass: #d4b676;
        --brass-ink: #1e1709;
        --brand: #d4b676;
        --brand-ink: #1e1709;
        --brand-soft: #2a2618;
        --ok: #6fcb98;
        --ok-soft: #14301f;
        --warn: #e6b66a;
        --warn-soft: #352812;
        --bad: #f2877d;
        --bad-soft: #3a1a17;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -10px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        background: var(--bg);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Instrument Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }
      img {
        max-width: 100%;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      svg.i {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      /* login */
      .login {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      }
      .login-art {
        background: var(--navy);
        color: var(--on-navy);
        padding: 48px clamp(32px, 5vw, 72px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
      }
      .login-art::after {
        content: "";
        position: absolute;
        right: -120px;
        bottom: -120px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        border: 1px solid rgba(194, 161, 94, 0.25);
        box-shadow:
          0 0 0 60px rgba(194, 161, 94, 0.05),
          0 0 0 120px rgba(194, 161, 94, 0.03);
      }
      .login-art h2 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(36px, 4vw, 54px);
        line-height: 1.05;
        margin: 0 0 18px;
        max-width: 14ch;
        letter-spacing: -0.01em;
      }
      .login-art p {
        color: var(--on-navy-2);
        max-width: 40ch;
        margin: 0;
      }
      .login-art .foot {
        font-size: 13px;
        color: var(--on-navy-2);
        position: relative;
        z-index: 1;
      }
      .login-form {
        display: grid;
        place-items: center;
        padding: 40px 20px;
        background: var(--bg);
      }
      .login-card {
        width: 100%;
        max-width: 380px;
      }
      .login-card h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 38px;
        margin: 0 0 6px;
      }
      .login-card .field {
        margin-bottom: 14px;
      }
      .login-card .btn.primary {
        width: 100%;
        justify-content: center;
        padding: 12px;
        font-size: 15px;
      }
      .loginerr {
        color: var(--bad);
        font-size: 14px;
        min-height: 21px;
        margin: 0 0 8px;
      }
      /* shell */
      .app {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
        min-height: 100vh;
        min-height: 100dvh;
      }
      .side {
        background: var(--navy);
        color: var(--on-navy);
        padding: 24px 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        height: 100vh;
        height: 100dvh;
        overflow: auto;
        align-self: start;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 0 8px;
        min-width: 0;
      }
      .brand > div {
        min-width: 0;
      }
      .mark {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--brass);
        color: var(--brass-ink);
        display: grid;
        place-items: center;
        font-family: var(--serif);
        font-size: 20px;
        flex: none;
      }
      .brand b {
        display: block;
        font-size: 14px;
        line-height: 1.25;
        font-weight: 600;
      }
      .brand small {
        color: var(--on-navy-2);
        font-size: 12.5px;
      }
      .env {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--brass);
        border: 1px solid rgba(194, 161, 94, 0.35);
        padding: 3px 10px;
        border-radius: 999px;
        width: max-content;
        margin-left: 8px;
      }
      .env::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
      }
      .nav button {
        display: flex;
        align-items: center;
        gap: 11px;
        background: none;
        border: 0;
        text-align: left;
        padding: 9px 12px;
        border-radius: 9px;
        cursor: pointer;
        color: var(--on-navy-2);
        font-weight: 500;
        position: relative;
      }
      .nav button:hover {
        background: var(--navy-2);
        color: var(--on-navy);
      }
      .nav button[aria-current="page"] {
        background: var(--navy-2);
        color: var(--on-navy);
      }
      .nav button[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--brass);
      }
      .nav button[aria-current="page"] svg {
        color: var(--brass);
      }
      .me {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 12px 8px 0;
        border-top: 1px solid var(--navy-2);
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--navy-2);
        color: var(--on-navy);
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 600;
        flex: none;
        border: 1px solid rgba(194, 161, 94, 0.4);
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      button.avatar {
        padding: 0;
        cursor: pointer;
        width: 36px;
        height: 36px;
      }
      .avatar.sm {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
      .avatar.lg {
        width: 76px;
        height: 76px;
        font-size: 26px;
        border-width: 2px;
      }
      .me .who {
        display: flex;
        align-items: center;
        gap: 11px;
        flex: 1;
        min-width: 0;
        background: none;
        border: 0;
        margin: -6px 0 -6px -6px;
        padding: 6px;
        border-radius: 10px;
        text-align: left;
        color: inherit;
        cursor: pointer;
      }
      .me .who:hover {
        background: var(--navy-2);
      }
      .me .who-txt {
        display: block;
        min-width: 0;
        flex: 1;
      }
      .me small {
        display: block;
      }
      .perfil {
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .perfil > div {
        min-width: 0;
      }
      .perfil b {
        display: block;
        font-size: 16px;
      }
      .withav {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mobileacts {
        display: none;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      .me b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .me small {
        color: var(--on-navy-2);
        font-size: 12px;
      }
      .me button {
        background: none;
        border: 0;
        color: var(--on-navy-2);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        display: grid;
      }
      .me button:hover {
        color: var(--on-navy);
        background: var(--navy-2);
      }

      main {
        padding: 40px clamp(18px, 4vw, 56px) 72px;
        max-width: 1160px;
        width: 100%;
        container-type: inline-size;
      }
      h1 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 40px;
        line-height: 1.05;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
        font-weight: 600;
      }
      .lead {
        color: var(--ink-2);
        margin: 0 0 28px;
        max-width: 64ch;
      }
      .muted {
        color: var(--ink-3);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .spread {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line-2);
        background: var(--surface);
        padding: 9px 15px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 500;
        font-size: 14px;
        white-space: nowrap;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .btn:hover {
        border-color: var(--ink-3);
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--brand-ink);
        font-weight: 600;
      }
      .btn.primary:hover {
        filter: brightness(1.15);
      }
      .btn.small {
        padding: 5px 11px;
        font-size: 13px;
        border-radius: 8px;
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .link {
        background: none;
        border: 0;
        padding: 0;
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--line-2);
        text-underline-offset: 3px;
        cursor: pointer;
        font-weight: 500;
        font-size: 13.5px;
      }
      .link:hover {
        text-decoration-color: currentColor;
      }
      .link.bad {
        color: var(--bad);
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px 24px;
        box-shadow: var(--shadow);
      }
      .stack {
        display: grid;
        gap: 20px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr));
        gap: 20px;
      }

      /* o gap de 1px sobre o fundo --line desenha os divisores em qualquer quebra */
      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--line);
        overflow: hidden;
        margin-bottom: 20px;
        box-shadow: var(--shadow);
      }
      .summary div {
        padding: 20px 22px;
        background: var(--surface);
        min-width: 0;
      }
      .summary span {
        display: block;
        font-size: 13px;
        color: var(--ink-3);
        font-weight: 500;
      }
      .summary strong {
        display: block;
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(22px, 4cqi - 6px, 32px);
        line-height: 1.1;
        margin-top: 6px;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .summary em {
        font-style: normal;
        font-size: 12.5px;
        color: var(--bad);
        font-weight: 500;
      }

      .alert {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 20px;
        background: var(--warn-soft);
        color: var(--warn);
        font-size: 14.5px;
      }
      .alert.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .alert b {
        font-weight: 600;
      }

      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th {
        text-align: left;
        font-weight: 500;
        color: var(--ink-3);
        font-size: 12.5px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        background: var(--surface-2);
      }
      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      tbody tr:hover td {
        background: color-mix(in srgb, var(--surface-2) 55%, transparent);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.num,
      th.num {
        text-align: right;
        white-space: nowrap;
      }
      td .sub {
        display: block;
        color: var(--ink-3);
        font-size: 12.5px;
      }
      tfoot td {
        font-weight: 600;
        background: var(--surface-2);
        border-top: 1px solid var(--line);
      }
      .actions {
        display: flex;
        gap: 14px;
        justify-content: flex-end;
        white-space: nowrap;
      }
      .errlist {
        margin: 4px 0 0;
        padding-left: 16px;
        color: var(--bad);
        font-size: 12.5px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .chip.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .chip.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .chip.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .chip.neutral {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .chip.brand {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .chip.pulse::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        animation: p 1s ease-in-out infinite;
      }
      @keyframes p {
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .chip.pulse::before {
          animation: none;
        }
        * {
          transition: none !important;
        }
      }

      .drop {
        display: block;
        border: 1.5px dashed var(--line-2);
        border-radius: 16px;
        padding: 44px 20px;
        text-align: center;
        cursor: pointer;
        background: var(--surface);
        transition:
          background 0.15s,
          border-color 0.15s;
        position: relative;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--brass);
        background: color-mix(in srgb, var(--brass) 7%, var(--surface));
      }
      .drop svg {
        width: 28px;
        height: 28px;
        color: var(--brass);
        margin-bottom: 10px;
      }
      .drop strong {
        display: block;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 26px;
        margin-bottom: 4px;
      }
      .drop input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      details {
        margin-top: 20px;
        color: var(--ink-2);
        font-size: 14px;
      }
      details summary {
        cursor: pointer;
        font-weight: 500;
        color: var(--ink);
      }
      details code {
        background: var(--surface-2);
        padding: 1px 6px;
        border-radius: 5px;
        font-size: 13px;
      }

      .progress {
        height: 6px;
        border-radius: 999px;
        background: var(--surface-2);
        overflow: hidden;
        margin: 14px 0 22px;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--brass);
        width: 0;
        transition: width 0.3s;
      }
      .banner {
        border-radius: 14px;
        padding: 18px 20px;
        margin-bottom: 20px;
        background: var(--ok-soft);
        color: var(--ok);
      }
      .banner b {
        display: block;
        font-size: 16px;
      }
      .banner.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
        gap: 14px 16px;
        align-items: end;
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field label {
        font-size: 13px;
        color: var(--ink-2);
        font-weight: 500;
      }
      .field input,
      .field select {
        border: 1px solid var(--line-2);
        background: var(--surface);
        border-radius: 10px;
        padding: 9px 12px;
        min-width: 0;
        width: 100%;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--brass);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 22%, transparent);
      }
      .field input:disabled {
        background: var(--surface-2);
        color: var(--ink-3);

      .servs {

  <body>
    <div class="login" id="login" hidden>
      <div class="login-art">

    <script>
      /* ---------- utilitários ---------- */
      const brlF = new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL",
      });
      const brl = (v) => brlF.format(v || 0);
      const pad = (n, l = 2) => String(n).padStart(l, "0");
      function toISO(d) {
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      }
      const todayISO = () => toISO(new Date());
      function addDays(iso, n) {
        const [y, m, d] = iso.split("-").map(Number);
        return toISO(new Date(y, m - 1, d + n));
      }
      const fmtDate = (iso) =>
        iso ? iso.slice(0, 10).split("-").reverse().join("/") : "—";
      const fmtDateTime = (iso) => {
        if (!iso) return "—";
        const d = new Date(iso);
        return (
          d.toLocaleDateString("pt-BR") +
          " " +
          d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        );
      };
      const fmtHora = (iso) =>
        new Date(iso).toLocaleTimeString("pt-BR", {
          hour: "2-digit",
          minute: "2-digit",
        });
      const monthLabel = (ym) => {
        const [y, m] = ym.split("-").map(Number);
        const s = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", {
          month: "long",
          year: "numeric",
        });
        return s.charAt(0).toUpperCase() + s.slice(1);
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const digits = (s) => String(s ?? "").replace(/\D/g, "");
      // CNPJ pode ter letras (CNPJ alfanumérico); CPF só dígitos
      const docNorm = (s) =>
        String(s ?? "")
          .toUpperCase()
          .replace(/[^0-9A-Z]/g, "");
      const plural = (n, s, p = s + "s") => (n === 1 ? s : p);

      // só para os dados de exemplo
      function cnpjDV(b) {
        const calc = (s, n) => {
          let t = 0,
            p = n - 7;
          for (let i = 0; i < n; i++) {
            t += +s[i] * p--;
            if (p < 2) p = 9;
          }
          const r = t % 11;
          return r < 2 ? 0 : 11 - r;
        };
        const d1 = calc(b, 12);
        const d2 = calc(b + d1, 13);
        return b + d1 + d2;
      }
      function fmtDoc(d) {
        d = docNorm(d);
        if (d.length === 14)
          return `${d.slice(0, 2)}.${d.slice(2, 5)}.${d.slice(5, 8)}/${d.slice(8, 12)}-${d.slice(12)}`;
        if (d.length === 11)
          return `${d.slice(0, 3)}.${d.slice(3, 6)}.${d.slice(6, 9)}-${d.slice(9)}`;
        return d;
      }
      const fmtServ = (c) =>
        c && c.length === 6
          ? `${c.slice(0, 2)}.${c.slice(2, 4)}.${c.slice(4)}`
          : c || "—";
      const fmtNBS = (c) =>
        c && c.length === 9
          ? `${c[0]}.${c.slice(1, 5)}.${c.slice(5, 7)}.${c.slice(7)}`
          : c || "—";
      const fmtPct = (v) =>
        v.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%";
      const numBR = (v) => (v == null ? "" : String(v).replace(".", ","));
      function parseNum(v) {
        let s = String(v ?? "").replace(/[R$\s%]/g, "");
        if (!s) return NaN;
        if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
        return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
      }
      const novaChave = () =>

      /* ---------- API ---------- */
      // Tudo passa pelo servidor. Sessão em cookie HttpOnly: este script nunca vê o token.
      class ErroApi extends Error {
        constructor(status, message, detalhes) {
          super(message);
          this.status = status;
          this.detalhes = detalhes;
        }
      }
      async function api(metodo, caminho, corpo) {
        const init = { method: metodo, headers: {}, credentials: "same-origin" };
        if (corpo instanceof FormData) init.body = corpo;
        else if (corpo !== undefined) {
          init.body = JSON.stringify(corpo);
          init.headers["content-type"] = "application/json";
        }
        let r;
        try {
          r = await fetch("/api" + caminho, init);
        } catch (e) {
          throw new ErroApi(
            0,
            "Sem conexão com o servidor. Confira a internet e tente de novo.",
          );
        }
        const tipo = r.headers.get("content-type") || "";
        const dados = tipo.includes("json") ? await r.json().catch(() => null) : null;
        if (r.status === 401 && caminho !== "/auth/login" && me) {
          me = null;
          batch = null;
          closeModal();
          render();
          toast("Sua sessão expirou. Entre de novo.");
        }
        if (!r.ok)
          throw new ErroApi(
            r.status,
            (dados && dados.erro) || "Erro inesperado. Tente de novo.",
            dados && dados.detalhes,
          );
        return dados;
      }
      async function baixarDaApi(caminho, nome) {
        let r;
        try {
          r = await fetch("/api" + caminho, { credentials: "same-origin" });
        } catch (e) {
          throw new ErroApi(0, "Sem conexão com o servidor.");
        }
        if (!r.ok) {
          const d = await r.json().catch(() => null);
          throw new ErroApi(r.status, (d && d.erro) || "Não foi possível baixar o arquivo.");
        }
        await baixar(nome, await r.blob());

      async function baixar(filename, data) {

          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          return;

          toast("Downloads não estão disponíveis nesta visualização.");

      async function lerArquivo(file) {
        if (typeof XLSX === "undefined") {

        let objs;
        try {
          const buf = await file.arrayBuffer();
          // Datas do Excel saem como número serial; no CSV o texto vai como está, sem
          // adivinhar se 01/11 é dia/mês ou mês/dia. Quem interpreta é o servidor.
          const wb = XLSX.read(buf, { type: "array", raw: /\.csv$/i.test(file.name) });
          const ws = wb.Sheets[wb.SheetNames[0]];
          objs = XLSX.utils.sheet_to_json(ws, { defval: "", raw: true });
        } catch (e) {

            phase: "erro",

            ? await api("POST", "/lotes/validar", { linhas: objs })
            : { rows: [], faltando: [] };
          if (v.faltando.length)
            batch = {
              phase: "erro",
              fileName,
              msg: `Não encontrei as colunas: ${v.faltando.join(", ")}. Confira o cabeçalho ou use a planilha modelo.`,

            batch = {
              phase: "erro",
              fileName,
              msg: "A planilha não tem linhas preenchidas.",
            };

            batch = {
              phase: "preview",
              fileName,
              rows: v.rows,
              objs,
              // a mesma chave em todo reenvio: clique duplo não cria dois lotes
              chave: novaChave(),
            };

          batch = { phase: "erro", fileName, msg: e.message };
        }
        render();

      async function emitirLote() {
        const b = batch;
        if (!b || b.phase !== "preview" || b.enviando) return;
        b.enviando = true;
        b.aviso = null;
        redesenhar();
        try {
          const r = await api("POST", "/lotes", {
            chave: b.chave,
            arquivo: b.fileName,
            linhas: b.objs,
          });
          batch = {
            phase: "lote",
            loteId: r.lote.id,
            fileName: b.fileName,
            resumo: r.lote,
            notas: [],
            ignoradas: b.rows.filter((x) => x.errors.length),
          };
          await atualizarLote(batch);
          processarLote(batch);
        } catch (e) {
          b.enviando = false;
          b.aviso = {
            msg: e.message,
            lista: (e.detalhes && e.detalhes.pendencias) || [],
          };
          if (batch === b && view === "lote") redesenhar();
        }
      }
      async function atualizarLote(b) {
        const r = await api("GET", `/lotes/${b.loteId}`);
        b.resumo = r;
        b.notas = r.notas;
        b.fileName = b.fileName || r.arquivo;
        if (batch === b && view === "lote") redesenhar();
      }
      // Cada chamada processa poucas notas e volta, para a tela andar nota a nota.
      // O servidor guarda tudo: sair da tela ou fechar o navegador não perde o lote.
      async function processarLote(b) {
        if (b.rodando) return;
        b.rodando = true;
        b.aviso = null;
        if (batch === b && view === "lote") redesenhar();
        try {
          for (;;) {
            const r = await api("POST", `/lotes/${b.loteId}/processar?max=2`, {});
            await atualizarLote(b);
            if (!r.rodada.processadas || !r.pendentes) break;
          }
        } catch (e) {
          b.aviso = { msg: e.message, lista: [] };
        } finally {
          b.rodando = false;
        }
        if (batch === b && view === "lote") redesenhar();
        const c = b.resumo.contagem,
          aut = c.autorizada || 0;
        if (!b.resumo.pendentes && aut)
          toast(`${aut} ${plural(aut, "nota autorizada", "notas autorizadas")}`);
      }

          batch = null;
          toast(e.message);
        }
        render();
      }
      async function reprocessarLote(b) {
        await api("POST", `/lotes/${b.loteId}/reprocessar`, {});

      // corta no centro e reduz para 192px; o servidor aceita até 200 KB
      async function salvarFoto(file) {
        if (!/^image\//.test(file.type)) {
          toast("Escolha um arquivo de imagem.");
          return;
        }
        let foto;
        try {
          const url = URL.createObjectURL(file);
          const img = new Image();
          await new Promise((ok, err) => {
            img.onload = ok;
            img.onerror = err;
            img.src = url;
          });
          URL.revokeObjectURL(url);
          const L = 192,
            s = Math.min(img.naturalWidth, img.naturalHeight);
          const c = document.createElement("canvas");
          c.width = c.height = L;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, L, L);
          ctx.drawImage(
            img,
            (img.naturalWidth - s) / 2,
            (img.naturalHeight - s) / 2,
            s,
            s,
            0,
            0,
            L,
            L,
          );
          foto = c.toDataURL("image/jpeg", 0.85);
        } catch (e) {
          toast("Não consegui ler essa imagem.");
          return;
        }
        await api("PUT", "/me/foto", { dataUrl: foto });
        me.temFoto = true;

        toast("Foto atualizada");

      };
      async function salvarCfg() {
        const g = (id) => document.getElementById(id).value.trim();
        const num = (id) => (g(id) ? parseNum(g(id)) : null);
        const aliq = num("cAliq"),
          pTot = num("cPTot");
        if (Number.isNaN(aliq) || Number.isNaN(pTot)) {
          toast("Confira os percentuais: use números como 2,5.");
          return;
        }
        const cst = digits(g("cCst"));
        const ibsCbs = cst
          ? {
              cst,
              cClassTrib: digits(g("cClass")),
              indDest: "0",
              ...(digits(g("cIndOp")) && { cIndOp: digits(g("cIndOp")) }),
              ...(g("cIndFinal") && { indFinal: g("cIndFinal") }),
            }
          : null;
        const r = await api("PUT", "/empresa", {
          razao: g("cRaz"),
          cnpj: g("cCnpj"),
          im: g("cIm"),
          cServPadrao: g("cServ"),
          cNBSPadrao: g("cNbs"),
          aliqIss: aliq,
          vencDias: Math.max(0, parseInt(g("cVenc")) || 0),
          serie: g("cSerie") || "900",
          proxDPS: Math.max(1, parseInt(g("cDps")) || 1),
          pTotTribSN: pTot,
          cLocPrestacao: digits(g("cLocPrest")),
          ibsCbs,
        });
        empresa = r;
        render();
        toast(r.certDesativado ? "CNPJ alterado. Envie o certificado do novo CNPJ." : "Dados salvos");
      }

      const diaLongo = (iso) => {
        const s = new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
        return s.charAt(0).toUpperCase() + s.slice(1);
      };
      const val = (id) => document.getElementById(id).value.trim();
      const valorBR = (v) => (v == null ? "" : numBR(v.toFixed(2)));
      const rodapeModal = (acao, id, botao) =>
        `<div class="row" style="justify-content:flex-end"><button class="btn" data-action="fechar">Cancelar</button><button class="btn primary" data-action="${acao}" data-id="${esc(id || "")}">${botao}</button></div>`;

        );
      const achar = (lista, id) => (lista || []).find((x) => x.id === id);

      /* clientes */
      V.clientes = (x) => `
  <h1>Clientes</h1>

  <div class="spread"><span class="muted">${x.clientes.length} ${plural(x.clientes.length, "cliente")}</span><div class="row"><button class="btn primary" data-action="novoCliente">Novo cliente</button></div></div>
  ${
    x.clientes.length
      ? `<div class="tablewrap cards"><table>
    <thead><tr><th>Cliente</th><th>Contato</th><th>Endereço</th><th>Plano</th><th></th></tr></thead>
    <tbody>${x.clientes
      .map(
        (c) => `<tr>
      <td class="c-title">${esc(c.nome)}<span class="sub">${esc(fmtDoc(c.doc))}</span></td>

  </table></div>`
      : '<div class="panel"><p class="empty" style="margin:0">Nenhum cliente cadastrado ainda.</p></div>'
  }`;
      function formCliente(c) {
        const planos = dados.planos;

  ${rodapeModal("salvarCliente", c.id, c.id ? "Salvar" : "Adicionar cliente")}`);

      async function salvarCliente(id) {
        const b = {
          nome: val("cliNome"),
          doc: val("cliDoc"),
          email: val("cliEmail").toLowerCase(),
          telefone: val("cliTel"),
          endereco: val("cliEnd"),
          planoId: val("cliPlano") || null,
        };
        if (!b.nome) return toast("Informe o nome do cliente.");

        if (b.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email)) return toast("Informe um e-mail válido.");
        await api(id ? "PUT" : "POST", id ? `/clientes/${encodeURIComponent(id)}` : "/clientes", b);

        render();

      /* planos e serviços */
      const itemCatalogo = (o, tipo, sub) => `<li><span>${esc(o.nome)}${sub ? `<small>${esc(sub)}</small>` : ""}
        <span class="row" style="gap:16px;margin-top:4px"><button class="link" data-action="editar${tipo}" data-id="${esc(o.id)}">Editar</button><button class="link bad" data-action="del${tipo}" data-id="${esc(o.id)}">Remover</button></span></span><b>${brl(o.valor)}</b></li>`;
      V.planos = (x) => `
  <h1>Planos e serviços</h1>

  <div class="grid2">
    <div class="panel">
      <div class="spread" style="margin-bottom:6px"><h2 style="margin:0">Planos</h2><button class="btn small" data-action="novoPlano">Novo plano</button></div>
      ${x.planos.length ? `<ul class="list">${x.planos.map((p) => itemCatalogo(p, "Plano", p.descricao || "Sem descrição para a nota")).join("")}</ul>` : '<p class="empty">Nenhum plano ainda.</p>'}
    </div>
    <div class="panel">
      <div class="spread" style="margin-bottom:6px"><h2 style="margin:0">Serviços avulsos</h2><button class="btn small" data-action="novoServico">Novo serviço</button></div>
      ${x.servicos.length ? `<ul class="list">${x.servicos.map((s) => itemCatalogo(s, "Servico")).join("")}</ul>` : '<p class="empty">Nenhum serviço avulso ainda.</p>'}
    </div>
  </div>`;
      function formPlano(p) {
        p = p || { nome: "", valor: null, descricao: "" };
        openModal(`<h2>${p.id ? "Editar plano" : "Novo plano"}</h2>
  <div class="form" style="margin:14px 0 20px">
    <div class="field"><label for="plNome">Nome</label><input id="plNome" maxlength="120" placeholder="Ex.: Mensal básico" value="${esc(p.nome)}"></div>

    <div class="field wide"><label for="plDesc">Descrição na nota</label><textarea id="plDesc" maxlength="1000" placeholder="Ex.: Manutenção mensal de piscina">${esc(p.descricao)}</textarea></div>
  </div>
  ${rodapeModal("salvarPlano", p.id, "Salvar")}`);
      }
      function formServico(s) {
        s = s || { nome: "", valor: null };
        openModal(`<h2>${s.id ? "Editar serviço" : "Novo serviço avulso"}</h2>
  <div class="form" style="margin:14px 0 20px">
    <div class="field"><label for="svNome">Nome</label><input id="svNome" maxlength="120" placeholder="Ex.: Troca de filtro" value="${esc(s.nome)}"></div>
    <div class="field"><label for="svValor">Valor (R$)</label><input id="svValor" inputmode="decimal" placeholder="0,00" value="${esc(valorBR(s.valor))}"></div>
  </div>
  ${s.id ? '<p class="muted" style="margin:-6px 0 16px">Mudar o valor não altera as visitas já registradas.</p>' : ""}

      async function salvarCatalogo(caminho, id, b, ok) {
        if (!b.nome) return toast("Informe o nome.");
        if (!(b.valor > 0)) return toast("Informe um valor maior que zero.");
        await api(id ? "PUT" : "POST", id ? `${caminho}/${encodeURIComponent(id)}` : caminho, b);
        closeModal();
        render();
        toast(ok);
      }

      /* rotas */
      V.rotas = (x) => `

  ${x.funcionarios.length ? "" : '<div class="alert"><span><b>Nenhum funcionário cadastrado.</b> Crie um usuário com o perfil Funcionário para montar as rotas.</span><button class="btn small" data-action="nav" data-view="usuarios">Abrir usuários</button></div>'}
  <div class="spread"><span class="muted">${x.rotas.length} ${plural(x.rotas.length, "rota")}</span><div class="row"><button class="btn primary" data-action="novaRota" ${x.funcionarios.length ? "" : "disabled"}>Nova rota</button></div></div>
  ${
    x.rotas.length
      ? `<div class="grid2">${x.rotas

    ${r.clientes.length ? `<ol class="stops">${r.clientes.map((c, i) => `<li><span class="n">${i + 1}</span><span>${esc(c.nome)}<small>${esc(c.endereco || "Sem endereço")}</small></span><span></span></li>`).join("")}</ol>` : '<p class="empty">Nenhum cliente nesta rota.</p>'}
    <div class="row" style="gap:16px;margin-top:10px"><button class="link" data-action="editarRota" data-id="${esc(r.id)}">Editar</button><button class="link bad" data-action="delRota" data-id="${esc(r.id)}">Remover</button></div>
  </div>`,
          )
          .join("")}</div>`
      : '<div class="panel"><p class="empty" style="margin:0">Nenhuma rota ainda.</p></div>'
  }`;
      let rotaEd = null; // rota sendo editada no modal
      function abrirRota(r) {

        rotaEd = r
          ? { id: r.id, nome: r.nome, funcionarioId: r.funcionarioAtivo ? r.funcionarioId : "", dias: [...r.dias], clientes: r.clientes.map((c) => c.id) }
          : { id: null, nome: "", funcionarioId: fs.length === 1 ? fs[0].id : "", dias: [1, 2, 3, 4, 5], clientes: [] };
        openModal(rotaHTML());

        rotaEd.funcionarioId = val("rFunc");

        lerRota();
        document.getElementById("dialog").innerHTML = rotaHTML();

      function rotaHTML() {
        const x = dados,
          r = rotaEd;
        const porId = new Map(x.clientes.map((c) => [c.id, c]));
        const fora = x.clientes.filter((c) => !r.clientes.includes(c.id));
        const ult = r.clientes.length - 1;
        return `<h2>${r.id ? "Editar rota" : "Nova rota"}</h2>
  <div class="form" style="margin:14px 0 18px">
    <div class="field"><label for="rNome">Nome da rota</label><input id="rNome" maxlength="80" placeholder="Ex.: Centro, manhã" value="${esc(r.nome)}"></div>

      .map((f) => `<option value="${esc(f.id)}" ${f.id === r.funcionarioId ? "selected" : ""}>${esc(f.nome)}</option>`)
      .join("")}</select></div>
    <div class="field wide" role="group" aria-labelledby="rDiasRot"><span class="rot" id="rDiasRot">Dias da semana</span><div class="dias">${DIAS.map(

    ).join("")}</div></div>
  </div>
  <h3 style="font-size:14px;font-weight:600;margin:0 0 4px">Ordem de atendimento</h3>

    r.clientes.length
      ? `<ol class="stops">${r.clientes
          .map((id, i) => {
            const c = porId.get(id) || { nome: "Cliente removido", endereco: "" };

          })
          .join("")}</ol>`
      : '<p class="empty">Adicione os clientes na ordem em que serão atendidos.</p>'
  }
  ${
    fora.length
      ? `<div class="row" style="margin-top:12px;align-items:end"><div class="field" style="flex:1;min-width:200px"><label for="rAdd">Adicionar cliente</label><select id="rAdd">${fora
          .map((c) => `<option value="${esc(c.id)}">${esc(c.nome)}</option>`)

      : x.clientes.length
        ? ""
        : '<p class="muted">Nenhum cliente cadastrado. <button class="link" data-action="nav" data-view="clientes">Cadastrar clientes</button></p>'

  <div style="margin-top:22px">${rodapeModal("salvarRota", r.id, r.id ? "Salvar rota" : "Criar rota")}</div>`;
      }
      async function salvarRota() {
        lerRota();
        const r = rotaEd;
        if (!r.nome) return toast("Informe o nome da rota.");
        if (!r.funcionarioId) return toast("Escolha o funcionário.");
        if (!r.dias.length) return toast("Escolha pelo menos um dia da semana.");
        const b = { nome: r.nome, funcionarioId: r.funcionarioId, dias: r.dias, clientes: r.clientes };
        await api(r.id ? "PUT" : "POST", r.id ? `/rotas/${encodeURIComponent(r.id)}` : "/rotas", b);
        rotaEd = null;
        closeModal();
        render();
        toast(r.id ? "Rota salva" : "Rota criada");
      }

      /* visitas do dia (empresa) */
      const chipVisita = (s) =>
        ({
          pendente: '<span class="chip neutral">Pendente</span>',
          em_atendimento: '<span class="chip warn">Em atendimento</span>',
          concluida: '<span class="chip ok">Concluída</span>',
          nao_realizada: '<span class="chip bad">Não realizada</span>',
        })[s];
      const encerrada = (v) => v.status === "concluida" || v.status === "nao_realizada";
      const linkGps = (g, rot) =>
        g
          ? `<a class="link" href="https://www.google.com/maps?q=${Number(g.lat)},${Number(g.lng)}" target="_blank" rel="noopener">${rot}</a>${g.precisao != null ? ` <span class="muted" style="white-space:nowrap">±${Number(g.precisao)} m</span>` : ""}`
          : `<span class="muted">${rot} sem GPS</span>`;
      function horario(v) {
        if (v.chegadaEm && v.fimEm) return `${fmtHora(v.chegadaEm)} às ${fmtHora(v.fimEm)}`;
        if (v.chegadaEm) return `desde ${fmtHora(v.chegadaEm)}`;
        return v.fimEm ? fmtHora(v.fimEm) : "—";

      V.visitas = (x) => {
        const vs = x.visitas;
        const conta = (s) => vs.filter((v) => v.status === s).length;
        const grupos = [];
        for (const v of vs) {
          let g = grupos.find((g) => g.id === v.funcionarioId);
          if (!g) grupos.push((g = { id: v.funcionarioId, nome: v.funcionarioNome, vs: [] }));
          g.vs.push(v);
        }

    <thead><tr><th>Cliente</th><th>Situação</th><th>Horário</th><th>Serviços avulsos</th><th>Local</th>${podeReabrir ? "<th></th>" : ""}</tr></thead>

      .map(
        (v) => `<tr>
      <td class="c-title">${esc(v.clienteNome)}<span class="sub">${esc(v.rotaNome)}${v.endereco ? ", " + esc(v.endereco) : ""}</span></td>

      ${podeReabrir ? `<td class="c-actions"><div class="actions">${v.status !== "pendente" ? `<button class="link" data-action="reabrirVisita" data-id="${esc(v.id)}">Reabrir</button>` : ""}</div></td>` : ""}

      .join("")}</tbody>

          )
          .join("")
      : `<div class="panel"><p class="empty" style="margin:0">${vazio}${hoje ? ' <button class="link" data-action="nav" data-view="rotas">Ver rotas</button>' : ""}</p></div>`
  }`;
      };

      /* minha rota (funcionário) */
      let campoFoco = null; // visita que o funcionário escolheu atender fora da ordem
      V.campo = (x) => {
        const vs = x.visitas;
        const fechadas = vs.filter(encerrada).length;
        const emAt = vs.find((v) => v.status === "em_atendimento");
        const atual = emAt || vs.find((v) => v.id === campoFoco && v.status === "pendente") || vs.find((v) => v.status === "pendente");
        const classe = (v) => (v.status === "concluida" ? "feito" : v.status === "nao_realizada" ? "falhou" : v === atual ? "agora" : "");
        return `
  <h1>Minha rota</h1>
  <p class="lead">${diaLongo(x.data)}.${vs.length ? ` ${fechadas} de ${vs.length} ${plural(vs.length, "visita")} ${plural(vs.length, "encerrada")}.` : ""}</p>
  ${vs.length ? `<div class="progress" style="margin-top:-14px"><i style="width:${(fechadas / vs.length) * 100}%"></i></div>` : ""}
  ${
    !vs.length
      ? '<div class="panel"><p class="empty" style="margin:0">Nenhuma visita para hoje.</p></div>'
      : atual
        ? cardAtual(atual, vs.indexOf(atual) + 1, vs.length, x.servicos)
        : '<div class="banner"><b>Rota do dia encerrada</b>Todas as visitas de hoje foram registradas.</div>'
  }
  ${
    vs.length
      ? `<div class="panel"><h2>Visitas de hoje</h2><ol class="stops">${vs
          .map(
            (v, i) =>
              `<li class="${classe(v)}"><span class="n">${i + 1}</span><span>${esc(v.clienteNome)}<small>${esc(v.endereco || "Sem endereço")}</small></span><span>${
                v.status === "pendente" && v !== atual && !emAt
                  ? `<button class="link" data-action="campoFoco" data-id="${esc(v.id)}">Atender agora</button>`
                  : v === atual ? "" : chipVisita(v.status)
              }</span></li>`,
          )
          .join("")}</ol></div>`
      : ""
  }`;
      };
      function cardAtual(v, pos, tot, servs) {
        const end = v.endereco;
        const q = encodeURIComponent(end || "");
        const mapas = end
          ? `<div class="row" style="margin-bottom:14px"><a class="btn" href="https://www.google.com/maps/dir/?api=1&amp;destination=${q}" target="_blank" rel="noopener">Abrir no Google Maps</a><a class="btn" href="https://waze.com/ul?q=${q}&amp;navigate=yes" target="_blank" rel="noopener">Abrir no Waze</a></div>`
          : "";
        const tel = v.telefone ? `<br><a class="link" href="tel:${esc(digits(v.telefone))}">${esc(v.telefone)}</a>` : "";
        const naoDeu = `<div style="text-align:center;margin-top:12px"><button class="link" data-action="campoNao" data-id="${esc(v.id)}">Não foi possível atender</button></div>`;

          return `<div class="panel agora-card">
    <span class="eyebrow">Próximo cliente, ${pos} de ${tot}</span>
    <h2>${esc(v.clienteNome)}</h2>

    ${naoDeu}
  </div>`;
        return `<div class="panel agora-card">

    }

    ${naoDeu}
  </div>`;
      }

      // GPS é a prova da visita. Sem ele o funcionário pode tentar de novo ou registrar assim mesmo.
      function pegarGps() {
        return new Promise((ok) => {
          if (!navigator.geolocation) return ok(null);
          navigator.geolocation.getCurrentPosition(
            (p) => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precisao: p.coords.accuracy }),
            () => ok(null),
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 },
          );
        });
      }
      let gpsPend = null;
      async function comGps(fn) {
        toast("Pegando a localização…");
        const gps = await pegarGps();
        if (gps) return fn(gps);
        gpsPend = fn;
        openModal(
          `<h2>Sem localização</h2><p class="muted">Não consegui a localização do celular. Confira se o GPS está ligado e se o navegador pode usar a localização.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-action="gpsSem">Registrar sem localização</button><button class="btn primary" data-action="gpsTentar">Tentar de novo</button></div>`,
        );
      }
      const urlVisita = (id, acao) => `/campo/visitas/${encodeURIComponent(id)}/${acao}`;

      /* faturamento mensal */
      const chipEnvio = (e) =>
        ({
          pendente: '<span class="chip neutral">Na fila</span>',
          enviado: '<span class="chip ok">Enviado</span>',
          erro: '<span class="chip bad">Não enviado</span>',
        })[e.status];
      V.faturamento = (x) => {

        const faturados = x.clientes.filter((c) => c.fatura).length;
        const soma = (k) => aFaturar.reduce((a, c) => a + c[k], 0);
        const avulsos = (c) =>
          c.itens.length ? `${c.itens.map((i) => esc(i.nome) + (i.qtd > 1 ? ` (${i.qtd}x)` : "")).join(", ")}<span class="sub">${brl(c.extras)}${c.fatura ? ", entra na próxima nota" : ""}</span>` : "—";
        const situacao = (c) =>
          c.fatura
            ? `${chipNota({ status: c.fatura.status, numero: c.fatura.numero })}`
            : c.total > 0
              ? '<span class="chip neutral">A faturar</span>'
              : '<span class="muted">Nada a cobrar</span>';
        const pendentes = x.envios.filter((e) => e.status === "pendente").length;
        return `
  <h1>Faturamento mensal</h1>
  <p class="lead">Uma nota por cliente com a mensalidade do plano mais os serviços avulsos marcados nas visitas e ainda não cobrados. ${monthLabel(x.mes)}.</p>
  ${certAlerta()}
  <div class="panel" style="margin-bottom:20px"><h2>Emissão automática</h2>
    <div class="form">
      <div class="field"><label for="fDia">Dia do mês</label><select id="fDia"><option value="">Desligada</option>${Array.from({ length: 31 }, (_, i) => i + 1)
        .map((d) => `<option value="${d}" ${cfg.diaEmissao === d ? "selected" : ""}>Dia ${d}</option>`)
        .join("")}</select></div>
      <label class="check"><input type="checkbox" id="fEmail" ${cfg.enviarEmail ? "checked" : ""}> Enviar a nota por e-mail ao cliente quando for autorizada</label>
    </div>
    <p class="muted" style="margin:12px 0 0">${
      cfg.proxima
        ? `Próxima emissão automática em <b>${fmtDate(cfg.proxima)}</b>. Se o sistema não rodar no dia, tenta nos ${cfg.toleranciaDias} dias seguintes. Dias 29 a 31 viram o último dia nos meses mais curtos.`
        : "Com a emissão automática desligada, use Emitir agora."
    }</p>
    ${cfg.enviarEmail && !x.emailConfigurado ? '<div class="alert" style="margin:14px 0 0"><span><b>E-mail ainda não configurado no servidor.</b> As notas ficam na fila de envio até RESEND_API_KEY e EMAIL_REMETENTE serem configurados.</span></div>' : ""}
    <div class="row" style="margin-top:14px"><button class="btn" data-action="salvarFat">Salvar</button></div>
  </div>
  <div class="summary">
    <div><span>Clientes a faturar</span><strong>${aFaturar.length}</strong></div>
    <div><span>Mensalidades</span><strong>${brl(soma("mensalidade"))}</strong></div>
    <div><span>Serviços avulsos</span><strong>${brl(soma("extras"))}</strong></div>
    <div><span>Total a faturar</span><strong>${brl(soma("total"))}</strong></div>
  </div>
  <div class="spread"><span class="muted">${faturados ? `${faturados} ${plural(faturados, "cliente já faturado", "clientes já faturados")} neste mês` : ""}</span><div class="row"><button class="btn primary" data-action="emitirFat" ${aFaturar.length ? "" : "disabled"}>Emitir agora</button></div></div>
  ${
    x.clientes.length
      ? `<div class="tablewrap cards"><table>
    <thead><tr><th>Cliente</th><th>Plano</th><th>Serviços avulsos</th><th class="num">A faturar</th><th>Situação</th></tr></thead>
    <tbody>${x.clientes
      .map(
        (c) => `<tr>
      <td class="c-title">${esc(c.nome)}<span class="sub">${c.email ? esc(c.email) : "Sem e-mail: a nota não é enviada"}</span></td>
      <td data-label="Plano">${c.plano ? `${esc(c.plano)}${c.mensalidade ? `<span class="sub">${brl(c.mensalidade)}</span>` : ""}` : '<span class="muted">Sem plano</span>'}</td>
      <td data-label="Avulsos">${avulsos(c)}</td>
      <td class="num" data-label="A faturar">${c.fatura ? "—" : brl(c.total)}</td>
      <td data-label="Situação">${situacao(c)}</td>
    </tr>`,
      )
      .join("")}</tbody>
  </table></div>`
      : '<div class="panel"><p class="empty" style="margin:0">Nenhum cliente cadastrado. <button class="link" data-action="nav" data-view="clientes">Cadastrar clientes</button></p></div>'
  }
  ${
    x.envios.length
      ? `<div class="spread" style="margin:30px 0 10px"><h2 style="margin:0">E-mails das notas</h2>${pendentes && x.emailConfigurado ? '<button class="btn small" data-action="enviarPendentes">Enviar pendentes agora</button>' : ""}</div>
  <div class="tablewrap cards"><table>
    <thead><tr><th>Nota</th><th>Para</th><th>Situação</th><th></th></tr></thead>
    <tbody>${x.envios
      .map(
        (e) => `<tr>
      <td class="c-title">NFS-e nº ${esc(e.numero || "")}<span class="sub">${esc(e.cliente)}</span></td>
      <td data-label="Para">${esc(e.para)}</td>
      <td data-label="Situação">${chipEnvio(e)}${e.status === "enviado" ? `<span class="sub">em ${fmtDateTime(e.enviadoEm)}</span>` : e.ultimoErro ? `<span class="sub">${esc(e.ultimoErro)}</span>` : ""}</td>
      <td class="c-actions"><div class="actions">${e.status !== "pendente" ? `<button class="link" data-action="reenviarEmail" data-id="${esc(e.id)}">Reenviar</button>` : ""}</div></td>
    </tr>`,
      )
      .join("")}</tbody>
  </table></div>`
      : ""
  }`;
      };
      const listaIgnorados = (ig) =>
        `<ul class="list">${ig.map((i) => `<li><span>${esc(i.cliente)}<small>${i.erros.map(esc).join(". ")}</small></span></li>`).join("")}</ul>`;

      const ACOES_CAMPO = {
        salvarFat: async () => {
          const dia = val("fDia");
          const r = await api("PUT", "/faturamento/config", { diaEmissao: dia ? Number(dia) : null, enviarEmail: document.getElementById("fEmail").checked });
          render();
          toast(r.proxima ? `Próxima emissão automática em ${fmtDate(r.proxima)}` : "Emissão automática desligada");
        },
        emitirFat: () => {
          const l = dados.clientes.filter((c) => !c.fatura && c.total > 0);
          const tot = l.reduce((a, c) => a + c.total, 0);
          openModal(
            `<h2>Emitir ${l.length} ${plural(l.length, "nota")}?</h2><p class="muted">Total de ${brl(tot)}. As notas entram na fila e vão para a Sefin agora. Quem já foi faturado neste mês fica de fora.</p>${rodapeModal("confirmaEmitirFat", "", "Emitir notas")}`,
          );
        },
        confirmaEmitirFat: async () => {
          const r = await api("POST", "/faturamento/emitir", {});
          closeModal();
          if (!r.lote) {
            if (r.ignorados.length) openModal(`<h2>Nenhuma nota emitida</h2><p class="muted">Estes cadastros precisam de ajuste antes:</p>${listaIgnorados(r.ignorados)}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-action="fechar">Fechar</button></div>`);
            else toast("Nada a faturar.");
            return render();
          }
          batch = { phase: "lote", loteId: r.lote.id, fileName: r.lote.arquivo, resumo: r.lote, notas: [], ignoradas: [] };
          view = "lote";
          await atualizarLote(batch);
          await render();
          processarLote(batch);
          if (r.ignorados.length)
            openModal(`<h2>${r.ignorados.length} ${plural(r.ignorados.length, "cliente ficou", "clientes ficaram")} de fora</h2><p class="muted">As outras notas já estão sendo enviadas. Ajuste estes cadastros e use Emitir agora de novo.</p>${listaIgnorados(r.ignorados)}<div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-action="fechar">Fechar</button></div>`);
        },
        enviarPendentes: async () => {
          const r = await api("POST", "/faturamento/envios/processar", {});
          render();
          toast(r.falhas ? `${r.enviados} ${plural(r.enviados, "enviado")}, ${r.falhas} com falha` : `${r.enviados} ${plural(r.enviados, "e-mail enviado", "e-mails enviados")}`);
        },
        reenviarEmail: (a) => {
          const e = achar(dados.envios, a.dataset.id);
          if (!e) return;
          openModal(
            `<h2>Reenviar a NFS-e nº ${esc(e.numero || "")}</h2><p class="muted">O e-mail sai de novo com o XML anexo. Troque o endereço se o cliente pediu outro.</p><div class="field" style="margin:14px 0 20px"><label for="rePara">Para</label><input id="rePara" type="email" maxlength="254" value="${esc(e.para)}"></div>${rodapeModal("confirmaReenvio", e.id, "Reenviar")}`,
          );
        },
        confirmaReenvio: async (a) => {
          const para = val("rePara").toLowerCase();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(para)) return toast("Informe um e-mail válido.");
          const r = await api("POST", `/faturamento/envios/${encodeURIComponent(a.dataset.id)}/reenviar`, { para });
          closeModal();
          render();
          toast(r.configurado ? (r.enviados ? "E-mail enviado" : "Não foi possível enviar agora; tenta de novo mais tarde") : "E-mail na fila; falta configurar o envio no servidor");
        },
        novoCliente: () => formCliente(null),
        editarCliente: (a) => formCliente(achar(dados.clientes, a.dataset.id)),
        salvarCliente: (a) => salvarCliente(a.dataset.id),
        delCliente: (a) => {
          const c = achar(dados.clientes, a.dataset.id);
          if (c)
            confirmarRemocao(`Remover ${esc(c.nome)}?`, "O cliente sai das rotas. As visitas já registradas continuam no histórico.", `/clientes/${encodeURIComponent(c.id)}`, "Cliente removido", "Remover cliente");
        },
        novoPlano: () => formPlano(null),
        editarPlano: (a) => formPlano(achar(dados.planos, a.dataset.id)),
        salvarPlano: (a) => salvarCatalogo("/planos", a.dataset.id, { nome: val("plNome"), valor: Math.round(parseNum(val("plValor")) * 100) / 100, descricao: val("plDesc") }, "Plano salvo"),
        delPlano: (a) => {
          const p = achar(dados.planos, a.dataset.id);
          if (p) confirmarRemocao(`Remover o plano ${esc(p.nome)}?`, "Clientes com este plano precisam trocar de plano antes.", `/planos/${encodeURIComponent(p.id)}`, "Plano removido", "Remover plano");
        },
        novoServico: () => formServico(null),
        editarServico: (a) => formServico(achar(dados.servicos, a.dataset.id)),
        salvarServico: (a) => salvarCatalogo("/servicos", a.dataset.id, { nome: val("svNome"), valor: Math.round(parseNum(val("svValor")) * 100) / 100 }, "Serviço salvo"),
        delServico: (a) => {
          const s = achar(dados.servicos, a.dataset.id);
          if (s) confirmarRemocao(`Remover ${esc(s.nome)}?`, "Ele deixa de aparecer para o funcionário. As visitas já registradas não mudam.", `/servicos/${encodeURIComponent(s.id)}`, "Serviço removido", "Remover serviço");
        },
        confirmaDel: async (a) => {
          await api("DELETE", a.dataset.url);
          closeModal();
          render();
          toast(a.dataset.msg);
        },
        novaRota: () => abrirRota(null),
        editarRota: (a) => abrirRota(achar(dados.rotas, a.dataset.id)),
        rotaMover: (a) => {
          lerRota();
          const l = rotaEd.clientes,
            i = +a.dataset.i,
            j = i + +a.dataset.d;
          if (j < 0 || j >= l.length) return;
          [l[i], l[j]] = [l[j], l[i]];
          redesenharRota();
        },
        rotaTirar: (a) => {
          lerRota();
          rotaEd.clientes.splice(+a.dataset.i, 1);
          redesenharRota();
        },
        rotaAdd: () => {
          lerRota();
          const id = val("rAdd");
          if (id) rotaEd.clientes.push(id);
          redesenharRota();
        },
        salvarRota: () => salvarRota(),
        delRota: (a) => {
          const r = achar(dados.rotas, a.dataset.id);
          if (r) confirmarRemocao(`Remover a rota ${esc(r.nome)}?`, "As visitas pendentes de hoje somem. As já registradas continuam no histórico.", `/rotas/${encodeURIComponent(r.id)}`, "Rota removida", "Remover rota");
        },
        reabrirVisita: (a) => {
          const v = achar(dados.visitas, a.dataset.id);
          if (v)
            openModal(
              `<h2>Reabrir a visita de ${esc(v.clienteNome)}?</h2><p class="muted">Os horários, a localização e os serviços marcados são apagados e a visita volta a ficar pendente para ${esc(v.funcionarioNome)}. O registro anterior fica na auditoria.</p>${rodapeModal("confirmaReabrir", v.id, "Reabrir visita")}`,
            );
        },
        confirmaReabrir: async (a) => {
          await api("POST", `/visitas/${encodeURIComponent(a.dataset.id)}/reabrir`, {});
          closeModal();
          render();
          toast("Visita reaberta");
        },
        campoFoco: (a) => {
          campoFoco = a.dataset.id;
          redesenhar();
          window.scrollTo(0, 0);
        },
        campoChegada: (a) =>
          comGps(async (gps) => {
            await api("POST", urlVisita(a.dataset.id, "chegada"), { gps });
            render();
            toast("Chegada registrada");
          }),
        campoConcluir: (a) => {
          const servicos = [...document.querySelectorAll("input[name=cServ]:checked")].map((i) => i.value);
          const obs = val("cObs");
          return comGps(async (gps) => {
            await api("POST", urlVisita(a.dataset.id, "concluir"), { gps, servicos, obs });
            campoFoco = null;
            await render();
            window.scrollTo(0, 0);
            toast("Atendimento concluído");
          });
        },
        campoNao: (a) =>
          openModal(
            `<h2>Não foi possível atender</h2><p class="muted">Conte o motivo. A empresa vê esse registro.</p><div class="field" style="margin:14px 0 20px"><label for="cMotivo">Motivo</label><textarea id="cMotivo" maxlength="300" placeholder="Ex.: cliente ausente, portão fechado"></textarea></div>${rodapeModal("campoNaoConfirma", a.dataset.id, "Registrar")}`,
          ),
        campoNaoConfirma: (a) => {
          const motivo = val("cMotivo");
          if (!motivo) return toast("Conte por que a visita não foi feita.");
          closeModal();
          return comGps(async (gps) => {
            await api("POST", urlVisita(a.dataset.id, "nao-realizada"), { gps, motivo });
            campoFoco = null;
            await render();
            window.scrollTo(0, 0);
            toast("Visita registrada como não realizada");
          });
        },
        gpsTentar: async () => {
          const fn = gpsPend;
          closeModal();
          if (fn) await comGps(fn);
        },
        gpsSem: async () => {
          const fn = gpsPend;
          gpsPend = null;
          closeModal();
          if (fn) await fn(null);
        },
      };
      const SO_EMPRESA_CAMPO = [
        "novoCliente", "editarCliente", "salvarCliente", "delCliente", "novoPlano", "editarPlano",
        "salvarPlano", "delPlano", "novoServico", "editarServico", "salvarServico", "delServico",
        "confirmaDel", "novaRota", "editarRota", "rotaMover", "rotaTirar", "rotaAdd", "salvarRota",
        "delRota", "reabrirVisita", "confirmaReabrir", "salvarFat", "emitirFat", "confirmaEmitirFat",
        "enviarPendentes", "reenviarEmail", "confirmaReenvio",
      ];

      /* ---------- eventos ---------- */
      const ACOES = {
        logout: () => sair(),
        perfil: () => abrirPerfil(),
        escolherFoto: () => document.getElementById("fotoFile").click(),
        removerFoto: async () => {
          await api("DELETE", "/me/foto");
          me.temFoto = false;
          renderShell();
          abrirPerfil();
          toast("Foto removida");
        },
        trocarSenha: () => trocarSenha(),
        nav: (a) => {
          closeModal();
          go(a.dataset.view);
        },
        modelo: () => baixarModelo(),
        exemplo: () => exemplo(),
        trocar: () => {
          batch = null;
          render();
        },
        emitir: () => emitirLote(),
        abrirLote: (a) => abrirLote(a.dataset.id),
        continuarLote: () => batch && batch.loteId && processarLote(batch),
        reprocessar: () => batch && batch.loteId && reprocessarLote(batch),
        ver: (a) => verNota(a.dataset.id),
        xml: async (a) => {
          const arqs = await api("GET", `/notas/${encodeURIComponent(a.dataset.id)}/xmls`);
          await zipArquivos(arqs, `${arqs.length ? arqs[0].nome.replace(/\.xml$/, "") : "NFSe"}.zip`);
        },
        cancelar: (a) => pedirCancelamento(a.dataset.id),
        confirmaCancel: (a) => confirmaCancel(a.dataset.id),
        verificarCanc: (a) => verificarCanc(a.dataset.id),
        fechar: () => closeModal(),
        zipMes: async () =>
          zipArquivos(
            await api("GET", `/notas/xmls?mes=${F.notasMes}&status=${F.notasStatus}`),
            `NFSe-xml-${F.notasMes}.zip`,
          ),
        zipExp: async () =>
          zipArquivos(
            await api("GET", `/notas/xmls?mes=${F.expMes}&status=todas`),
            `NFSe-xml-${F.expMes}.zip`,
          ),
        csvNotas: () => baixarDaApi(`/exportar/${F.expMes}/notas.csv`, `notas-${F.expMes}.csv`),
        csvFin: () => baixarDaApi(`/exportar/${F.expMes}/financeiro.csv`, `financeiro-${F.expMes}.csv`),
        receber: async (a) => {
          await api("POST", `/receber/${encodeURIComponent(a.dataset.id)}/recebido`, {});
          render();
          toast("Recebimento registrado");
        },
        desfazRec: async (a) => {
          await api("DELETE", `/receber/${encodeURIComponent(a.dataset.id)}/recebido`);
          render();
        },
        addPagar: () => addPagar(),
        pagar: (a) => marcarPaga(a.dataset.id),
        desfazPag: async (a) => {
          await api("DELETE", `/pagar/${encodeURIComponent(a.dataset.id)}/pago`);
          render();
        },
        delPagar: async (a) => {
          await api("DELETE", `/pagar/${encodeURIComponent(a.dataset.id)}`);
          render();
          toast("Conta excluída");
        },
        salvarCfg: () => salvarCfg(),
        verCert: () => enviarCert(),
        addUser: () => addUser(),
        delUser: (a) => {
          const u = (Array.isArray(dados) ? dados : []).find((x) => x.id === a.dataset.id);
          if (!u || u.id === me.id) return;
          openModal(
            `<h2>Remover acesso de ${esc(u.nome)}?</h2><p class="muted">${esc(u.email)} não vai mais conseguir entrar no sistema, e as sessões abertas são encerradas.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-action="fechar">Voltar</button><button class="btn primary" data-action="confirmaDelUser" data-id="${esc(u.id)}">Remover acesso</button></div>`,
          );
        },
        confirmaDelUser: async (a) => {
          await api("DELETE", `/usuarios/${encodeURIComponent(a.dataset.id)}`);
          closeModal();
          render();
          toast("Acesso removido");
        },
      };
      // O servidor é quem decide o que cada perfil pode; aqui só evita o clique inútil.
      const SO_EMPRESA = new Set([
        "modelo", "exemplo", "emitir", "continuarLote", "reprocessar", "cancelar",
        "confirmaCancel", "verificarCanc", "receber", "desfazRec", "addPagar", "pagar",
        "desfazPag", "delPagar", "salvarCfg", "addUser", "delUser", "confirmaDelUser", "verCert",
        ...SO_EMPRESA_CAMPO,
      ]);
      Object.assign(ACOES, ACOES_CAMPO);
      document.addEventListener("click", async (e) => {
        const a = e.target.closest("[data-action]");
        if (!a) return;
        const acao = a.dataset.action;
        if (SO_EMPRESA.has(acao) && !isEmp()) return;
        const f = ACOES[acao];
        if (!f || a.disabled) return;
        // botão fica travado enquanto a requisição anda: clique duplo não repete a ação
        a.disabled = true;
        try {
          await f(a);
        } catch (ex) {
          toast(ex.message || "Algo deu errado. Tente de novo.");
        } finally {
          a.disabled = false;
        }
      });
      document.addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "file" && t.files[0]) {
          if (isEmp()) lerArquivo(t.files[0]);
          return;
        }
        if (t.id === "fotoFile" && t.files[0]) {
          salvarFoto(t.files[0]).catch((ex) => toast(ex.message));
          return;
        }
        if (t.dataset.filter) {
          if (t.value || t.type !== "month") {
            F[t.dataset.filter] = t.value;
            render();
          }
        }
      });

      (async () => {
        try {
          await iniciarSessao();
        } catch (e) {
          me = null;
        }
        render();
      })();
    </script>
  </body>
</html>
